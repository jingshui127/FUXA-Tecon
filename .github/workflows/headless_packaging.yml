name: Build FUXA Headless (Latest)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-headless]
  push:
    branches: [1.3.4-2888]
    paths:
      - '.github/workflows/headless_packaging.yml'
      - 'server/**'
      - 'client/src/**'
      - 'app/headless/**'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install build dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get update && sudo apt-get install -y build-essential unixodbc unixodbc-dev

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server

    - name: Install client dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./client

    - name: Build client
      run: npm run build -- --configuration=production
      working-directory: ./client

    - name: Setup Headless Package Directory
      run: |
        mkdir -p fuxa-headless/server
        mkdir -p fuxa-headless/client/dist
        
        # Copy everything just like the Electron workflow does
        cp -r server/. fuxa-headless/server/
        cp -r client/dist/. fuxa-headless/client/dist/
        
        # Use the entry point as the main file for pkg
        cp app/headless/headless-guardian.js fuxa-headless/main.js
      shell: bash

    - name: Create Package Config
      run: |
        cat > fuxa-headless/package.json <<'EOF'
        {
          "name": "fuxa-headless",
          "version": "1.3.4-2888",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*"
            ],
            "publicPackages": [
              "node-snap7",
              "sqlite3",
              "serialport",
              "@serialport/bindings-cpp",
              "@serialport/parser-readline",
              "@serialport/parser-regex",
              "@serialstream/bindings-cpp"
            ],
            "compression": "GZip"
          }
        }
        EOF
      shell: bash

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg


    - name: Build Standalone Binaries (Headless)
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TARGET="node18-linux-arm64"
          else
            TARGET="node18-linux-x64"
          fi
        elif [ "$RUNNER_OS" = "Windows" ]; then
          TARGET="node18-win-x64"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TARGET="node18-macos-arm64"
          else
            TARGET="node18-macos-x64"
          fi
        fi
        mkdir -p artifacts
        pkg fuxa-headless/package.json --targets $TARGET --output artifacts/FUXA-1.3.4-2888-win-x64.exe
      shell: bash
      working-directory: .

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: headless-latest
        name: FUXA Headless Latest Build
        body: |
          FUXA Headless (守护进程模式) 自动构建
          
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Build Date: ${{ github.event.repository.updated_at }}
        files: artifacts/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
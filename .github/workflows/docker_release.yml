name: Build FUXA PRO Docker Image (Release)

env:
  app: fuxa-pro
  version: 1.3.1
  platforms: linux/amd64

on: workflow_dispatch

jobs:
  build-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU emulator
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: ${{ env.platforms }}
          tags: jingshui127/${{ env.app }}:${{ env.version }}
          outputs: type=docker,dest=${{ env.app }}-${{ env.version }}-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app }}-${{ env.version }}-amd64
          path: ${{ env.app }}-${{ env.version }}-amd64.tar
          retention-days: 30

name: Build and Publish FUXA PRO release

env:
  app: fuxa-pro
  version: 1.3.1
  platforms: linux/amd64,linux/arm64,linux/arm/v7

on: workflow_dispatch

jobs:
  build-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU emulator
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          platforms: ${{ env.platforms }}
          tags: jingshui127/${{ env.app }}:${{ env.version }}
          outputs: type=tar,dest=${{ env.app }}-${{ env.version }}-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app }}-${{ env.version }}-amd64
          path: ${{ env.app }}-${{ env.version }}-amd64.tar
          retention-days: 30

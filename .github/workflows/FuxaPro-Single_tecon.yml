name: Build FUXA PRO-Single (Tecon)

on:
  workflow_dispatch:
  push:
    branches: [1.3.2-PRO]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clear cache
      uses: actions/delete-package-versions@v4
      continue-on-error: true
      with:
        package-name: 'cache'
        min-versions-to-keep: 1

    - name: Display contact information
      run: |
        echo "Build FUXA PRO-Single (TC)"
        echo "Contact information: QQ 2492123056"
      shell: bash

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server



    - name: Setup Headless Package Directory
      run: |
        mkdir -p fuxa-headless/server
        mkdir -p fuxa-headless/client/dist
        
        # Copy everything just like the Electron workflow does
        cp -r server/. fuxa-headless/server/
        cp -r client/dist/. fuxa-headless/client/dist/
        
        # Use the entry point as the main file for pkg
        cp app/headless/headless-entry.js fuxa-headless/main.js
        
        # Clean up unnecessary files to reduce size
        Remove-Item -Path "fuxa-headless/server/_logs" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "fuxa-headless/server/_appdata" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "fuxa-headless/server/_db" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "fuxa-headless/server/node_modules/.cache" -Recurse -Force -ErrorAction SilentlyContinue
      shell: powershell

    - name: Create Package Config
      run: |
        cat > fuxa-headless/package.json <<EOF
        {
          "name": "FuxaPro-Single",
          "version": "1.3.1-PRO",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*"
            ],
            "compression": "Brotli"
          }
        }
        EOF
      shell: bash

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg


    - name: Build Standalone Binaries (Headless)
      run: |
        TARGET="node18-win-x64"
        pkg fuxa-headless/package.json --targets $TARGET --out-path artifacts --public-packages "node-snap7,bindings,nan"
      shell: bash
      working-directory: .


    - name: Prepare artifacts
      run: |
        mv artifacts/FuxaPro-Single-win-x64.exe artifacts/FuxaPro-Single-windows-x64.exe || true
      shell: bash

    - name: List built files
      run: |
        ls -la artifacts/
        echo "Build completed! Artifact: FuxaPro-Single-windows-x64.exe"
      shell: bash

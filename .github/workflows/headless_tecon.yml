name: Build FUXA Single (Tecon)

on:
  workflow_dispatch:
  push:
    branches: [1.3.3-minimal]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'



    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server

    - name: Install client dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./client

    - name: Build client
      run: npm run build -- --configuration=production
      working-directory: ./client

    - name: Setup Headless Package Directory
      run: |
        mkdir -p fuxa-single/server
        mkdir -p fuxa-single/client/dist
        
        # Copy everything just like the Electron workflow does
        cp -r server/. fuxa-single/server/
        cp -r client/dist/. fuxa-single/client/dist/
        
        # Use the entry point as the main file for pkg
        cp app/headless/headless-entry.js fuxa-single/main.js
      shell: bash

    - name: Create Package Config
      run: |
        cat > fuxa-single/package.json <<EOF
        {
          "name": "fuxa-single",
          "version": "1.3.3-tecon",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*"
            ],
            "compression": "Brotli"
          }
        }
        EOF
      shell: bash

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg


    - name: Build Standalone Binaries (Headless)
      run: |
        TARGET="node18-win-x64"
        echo "=== Starting pkg build ==="
        echo "Working directory: $(pwd)"
        echo "Package file:"
        cat fuxa-single/package.json
        echo "=== Running pkg ==="
        npx @yao-pkg/pkg fuxa-single/package.json --targets $TARGET --out-path artifacts --public-packages "node-snap7,bindings,nan" --debug 2>&1
        PKG_EXIT=$?
        echo "=== pkg exit code: $PKG_EXIT ==="
        echo "=== Artifacts after build ==="
        ls -la artifacts/ || true
        if [ $PKG_EXIT -ne 0 ]; then
          echo "::error::pkg build failed with exit code $PKG_EXIT"
          exit $PKG_EXIT
        fi
      shell: bash
      working-directory: .

    - name: Prepare artifacts
      run: |
        echo "=== Looking for generated EXE ==="
        ls -la artifacts/ || true
        if [ -f artifacts/fuxa-single-win-x64.exe ]; then
          mv artifacts/fuxa-single-win-x64.exe artifacts/FUXA-single-1.3.3-tecon-windows-x64.exe
          echo "EXE renamed successfully (fuxa-single-win-x64.exe)"
        elif [ -f artifacts/fuxa-single.exe ]; then
          mv artifacts/fuxa-single.exe artifacts/FUXA-single-1.3.3-tecon-windows-x64.exe
          echo "EXE renamed successfully (fuxa-single.exe)"
        else
          echo "::error::No exe file found in artifacts/"
          ls -laR artifacts/ || true
          exit 1
        fi
        ls -la artifacts/
      shell: bash

    - name: Update EXE version properties (optional)
      run: |
        if [ ! -f "artifacts/FUXA-single-1.3.3-tecon-windows-x64.exe" ]; then
          echo "::warning::EXE file not found, skipping version property update"
          exit 0
        fi
        npm install -g rcedit 2>/dev/null || true
        # Try multiple ways to run rcedit
        RCEDIT_CMD=""
        if command -v rcedit &>/dev/null; then
          RCEDIT_CMD="rcedit"
        elif [ -f "/c/npm/prefix/rcedit.cmd" ]; then
          RCEDIT_CMD="/c/npm/prefix/rcedit.cmd"
        elif [ -f "$APPDATA/npm/rcedit.cmd" ]; then
          RCEDIT_CMD="$APPDATA/npm/rcedit.cmd"
        fi
        if [ -n "$RCEDIT_CMD" ]; then
          $RCEDIT_CMD "artifacts/FUXA-single-1.3.3-tecon-windows-x64.exe" \
            --set-version-string "CompanyName" "科控物联" \
            --set-version-string "FileDescription" "FUXA SCADA/HMI 系统" \
            --set-version-string "FileVersion" "1.3.3.0" \
            --set-version-string "ProductName" "FUXA 科控物联定制版" \
            --set-version-string "ProductVersion" "1.3.3-tecon" \
            --set-version-string "LegalCopyright" "Copyright (C) 2026 科控物联" \
            --set-version-string "OriginalFilename" "FUXA-single-1.3.3-tecon-windows-x64.exe" && \
          echo "EXE version properties updated successfully" || \
          echo "::warning::rcedit failed (non-critical), artifact will be uploaded without version info"
        else
          echo "::warning::rcedit not found, skipping version property update (artifact will still upload)"
        fi
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUXA-single-1.3.3-tecon
        path: artifacts/*
        retention-days: 1
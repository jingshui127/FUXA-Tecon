name: Build FUXA Headless (Latest)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-headless]
  push:
    branches: [1.3.5-2918]
    paths:
      - '.github/workflows/headless_packaging.yml'
      - 'server/**'
      - 'client/src/**'
      - 'app/headless/**'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install build dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get update && sudo apt-get install -y build-essential unixodbc unixodbc-dev

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server

    - name: Install client dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./client

    - name: Build client
      run: npm run build -- --configuration=production
      working-directory: ./client

    - name: Setup Headless Package Directory
      run: |
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue fuxa-headless
        New-Item -ItemType Directory -Force -Path fuxa-headless/server | Out-Null
        New-Item -ItemType Directory -Force -Path fuxa-headless/client/dist | Out-Null

        # Copy ALL server files including node_modules (pkg bundles them into the EXE)
        Copy-Item -Recurse -Force "server\*" "fuxa-headless\server\" -ErrorAction SilentlyContinue

        # Copy client/dist files
        if (Test-Path client/dist) {
          Copy-Item -Recurse -Force "client\dist\*" "fuxa-headless\client\dist\" -ErrorAction SilentlyContinue
        }

        # Copy headless main.js
        Copy-Item -Force "app\headless\headless-guardian.js" "fuxa-headless\main.js"
      shell: powershell

    - name: Create Package Config
      run: |
        $pkgJson = @{
          name = "fuxa-headless"
          version = "1.3.6-2918"
          bin = "main.js"
          pkg = @{
            assets = @("server/**/*", "client/dist/**/*", "_reports/**/*")
            compression = "Brotli"
          }
        }
        $pkgJson | ConvertTo-Json -Depth 5 | Set-Content -Path fuxa-headless/package.json -Encoding ASCII
      shell: powershell

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg


    - name: Build Standalone Binaries (Headless)
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        pkg fuxa-headless/package.json --targets node18-win-x64 --output artifacts/FUXA-1.3.6-2918-win-x64.exe
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUXA-1.3.6-2918-win-x64
        path: artifacts/*
        if-no-files-found: error

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: headless-latest-${{ github.run_id }}
        name: headless-latest-${{ github.run_id }}
        body: |
          FUXA Headless (守护进程模式) 自动构建

          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Build Date: ${{ github.event.repository.updated_at }}
        files: artifacts/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
ool 标签、客户端脚本每次 interval 重复执行、Modbus 与 OPC UA 写失败不上报、HMI 回车重复提交、Node-RED 基础路径下的路由与登出……都是现场真会碰到的。</p>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f6fbf;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0f6fbf;margin:14px 0 24px;border-bottom:3px solid #0f6fbf;padding-bottom:9px;\">科控 PRO 版在此之上做了什么</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;line-height:1.6;color:#333;margin:0 0 20px;\">\n  <tr>\n    <th style=\"border:1px solid #d8e3ee;background:#eef5fc;color:#0f6fbf;font-weight:bold;padding:9px 10px;text-align:left;font-size:14px;\">场景</th>\n    <th style=\"border:1px solid #d8e3ee;background:#eef5fc;color:#0f6fbf;font-weight:bold;padding:9px 10px;text-align:left;font-size:14px;\">科控 PRO 版</th>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">部署方式</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">单个 EXE 自带 Node.js 18 运行时，复制即用，免安装</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">品牌外观</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">内置科控物联 TcScada 品牌；EXE 同级 <strong>customization\\</strong> 目录可运行时替换 LOGO 与配置</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">通讯稳定性</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">S7 断线自动重连，单台设备异常不牵连其他设备</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">流程编排</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">Node-RED 提供 <strong>/flows</strong> 管理入口与 <strong>/dashboard</strong> 面板入口</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">开机自启</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">Agent.exe 进程守护，程序崩溃后自动拉起，附一键安装 / 卸载脚本</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">数据迁移</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">数据库、流程与插件集中在 <strong>data\\</strong>，整目录搬迁即可</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">原生插件</td>\n    <td style=\"border:1px solid #d8e3ee;padding:9px 10px;vertical-align:top;\">ODBC、chartjs-node-canvas 已预置并实际验证</td>\n  </tr>\n</table>\n\n<p style=\"margin:48px 0 0;\"><span style=\"display:inline-block;background:#0f6fbf;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0f6fbf;margin:14px 0 24px;border-bottom:3px solid #0f6fbf;padding-bottom:9px;\">适合谁，不适合谁</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 14px;\"><strong>适合</strong>：要把现场设备联网做集中监控；现场只有一台工控机、希望免安装部署；需要给最终用户换成自己的品牌；或者 S7 / Modbus / OPC UA / EtherNet/IP 多驱动混用。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 34px;\"><strong>不适合</strong>：只做一次性数据看板、不接现场设备；或者只想跑纯开源版、不希望附带守护服务。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 14px;\">已经部署的现场，可以直接升级到 1.3.5；还没上手的，可以先用一台工控机试装，跑通一个 Modbus 或 S7 设备再往下走。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 34px;\">下载与资料入口：<strong style=\"color:#0f6fbf;\">科控物联 FUXA PRO</strong>。技术问题可直接联系下方服务号。</p>\n\n<p style=\"background:#eef5fc;border-left:4px solid #0f6fbf;padding:16px 18px;font-size:15px;line-height:1.9;color:#2b4b6f;margin:0 0 30px;\">技术服务 QQ：<strong style=\"font-size:17px;color:#0f6fbf;\">2492123056</strong><br />服务范围：安装部署、驱动对接、品牌定制</p>\n\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0;\">科控物联 · FUXA PRO 1.3.5</p>\n"
}

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>

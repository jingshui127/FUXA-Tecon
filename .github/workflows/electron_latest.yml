name: Build FUXA PRO Electron App

on:
  workflow_dispatch:
  push:
    branches: [1.3.1-PRO]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install server dependencies
      run: npm install
      working-directory: ./server

    - name: Install app dependencies
      run: npm install
      working-directory: ./app/electron

    - name: Copy server and client build to app/electron
      run: |
        mkdir -p app/electron/server
        mkdir -p app/electron/client/dist
        cp -r server/. app/electron/server/
        cp -r client/dist/. app/electron/client/dist
      shell: bash

    - name: Install app dependencies for Electron
      run: npx electron-builder install-app-deps
      working-directory: ./app/electron
      env:
        ELECTRON_ARCH: ${{ matrix.arch }}

    - name: Package for Windows
      if: matrix.os == 'windows-latest'
      run: npx electron-builder --win nsis --x64
      working-directory: ./app/electron

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        mv dist/*.exe artifacts/FUXA-PRO-windows-x64.exe
      working-directory: ./app/electron
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUXA-PRO-electron-windows-x64
        path: app/electron/artifacts/*

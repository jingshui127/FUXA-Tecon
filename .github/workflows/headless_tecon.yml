name: Build FUXA Headless (Tecon)

on:
  workflow_dispatch:
  push:
    branches: [1.3.1-minimal]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install build dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get update && sudo apt-get install -y build-essential unixodbc unixodbc-dev

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server

    - name: Install client dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./client

    - name: Build client
      run: npm run build -- --configuration=production
      working-directory: ./client

    - name: Setup Headless Package Directory
      run: |
        mkdir -p fuxa-headless/server
        mkdir -p fuxa-headless/client/dist
        
        cp -r server/. fuxa-headless/server/
        cp -r client/dist/. fuxa-headless/client/dist/
        
        cp app/headless/headless-entry.js fuxa-headless/main.js
      shell: bash

    - name: Create Package Config
      run: |
        cat > fuxa-headless/package.json <<EOF
        {
          "name": "fuxa-headless",
          "version": "1.3.1-tecon",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*"
            ],
            "publicPackages": ["node-snap7", "bindings", "nan"],
            "compression": "Brotli"
          }
        }
        EOF
      shell: bash

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg

    - name: Build Standalone Binaries (Headless)
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          TARGET="node18-linux-x64"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          TARGET="node18-win-x64"
        fi
        pkg fuxa-headless/package.json --targets $TARGET --out-path artifacts --public-packages "node-snap7,bindings,nan"
      shell: bash
      working-directory: .

    - name: Prepare artifacts
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv artifacts/fuxa-headless-win-x64.exe artifacts/FUXA-headless-windows-x64.exe || true
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          mv artifacts/fuxa-headless-linux-x64 artifacts/FUXA-headless-linux-x64 || true
        fi
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUXA-headless-${{ matrix.os }}-${{ matrix.arch }}
        path: artifacts/*
        retention-days: 30

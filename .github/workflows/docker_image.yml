name: Build Multi-Arch Docker Image

# 一次构建产出 linux/amd64 + linux/arm64 双架构镜像，推送 GHCR。
# arm64 由 GitHub Actions 上的 QEMU 模拟，不再占用本机资源。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像 tag（留空则取 server/package.json 的 version）'
        required: false
        default: ''
  push:
    branches:
      - 1.3.6-2918
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker_image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jingshui127/fuxa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(node -p "require('./server/package.json').version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "镜像版本: $V"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 在 runner 上直接以 arm64 运行刚推送的镜像，确认不是只"构建成功"却起不来
      - name: Smoke test arm64
        run: |
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          docker pull --platform linux/arm64 "$IMG"
          docker run -d --name fuxa-smoke --platform linux/arm64 -p 1881:1881 "$IMG"
          ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1881/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          docker logs --tail 30 fuxa-smoke
          docker rm -f fuxa-smoke
          if [ "$ok" != "1" ]; then
            echo "arm64 容器未返回 200（最后状态码 $code）"
            exit 1
          fi
          echo "arm64 启动验证通过"

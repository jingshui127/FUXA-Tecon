name: Build Multi-Arch Docker Image

# 一次构建产出 linux/amd64 + linux/arm64 双架构镜像，推送 GHCR。
# arm64 由 GitHub Actions 上的 QEMU 原生模拟，不再占用本机资源。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像 tag（例如 1.3.6-2918）'
        required: true
        default: '1.3.6-2918'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jingshui127/fuxa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

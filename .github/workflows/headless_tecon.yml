name: Build FUXA PRO Headless EXE

on:
  workflow_dispatch:
  push:
    branches: [1.3.4-PRO]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

permissions:
  contents: write

concurrency:
  group: headless-tecon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node18-npm-${{ hashFiles('server/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node18-npm-

    - name: Install server dependencies
      run: |
        npm ci --prefer-offline --no-audit --no-fund
      working-directory: ./server

    - name: Setup Headless Package Directory
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path fuxa-headless/server, fuxa-headless/client/dist | Out-Null
        robocopy server fuxa-headless/server /E /NFL /NDL /NJH /NJS /NP /XD node_modules .git
        if ($LASTEXITCODE -gt 7) { throw "robocopy server failed with exit code $LASTEXITCODE" }
        robocopy client/dist fuxa-headless/client/dist /E /NFL /NDL /NJH /NJS /NP
        if ($LASTEXITCODE -gt 7) { throw "robocopy client failed with exit code $LASTEXITCODE" }
        Copy-Item app/headless/headless-guardian.js fuxa-headless/main.js -Force

    - name: Prepare Headless Dependencies
      shell: pwsh
      working-directory: ./fuxa-headless
      run: |
        $ErrorActionPreference = 'Stop'
        Copy-Item ../server/package.json ./package.json -Force
        Copy-Item ../server/package-lock.json ./package-lock.json -Force
        node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p)); pkg.name='fuxa-pro-headless'; pkg.version='1.3.4-PRO'; pkg.bin='main.js'; pkg.dependencies={...(pkg.dependencies||{}),ip:'^2.0.1'}; pkg.pkg={assets:['server/**/*','node_modules/**/*','client/dist/**/*','_reports/**/*'],publicPackages:['bindings','@serialport/bindings-cpp'],compression:'None'}; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
        npm ci --omit=dev --no-audit --no-fund
        node server/scripts/patch-nodered.js

    - name: Cache pkg runtime
      uses: actions/cache@v4
      with:
        path: ~/.pkg-cache
        key: ${{ runner.os }}-pkg-node18-${{ hashFiles('fuxa-headless/package.json') }}
        restore-keys: |
          ${{ runner.os }}-pkg-node18-

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg@6.13.1

    - name: Build Standalone EXE (Node.js 18 + GZip)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sw = [Diagnostics.Stopwatch]::StartNew()
        pkg fuxa-headless/package.json --targets node18-win-x64 --output artifacts/fuxa-pro-headless.exe --public-packages "bindings,@serialport/bindings-cpp"
        $sw.Stop()
        Write-Host "pkg build elapsed: $([math]::Round($sw.Elapsed.TotalMinutes, 2)) minutes"

    - name: Verify EXE artifact
      shell: powershell
      run: |
        $exe = Join-Path $PWD 'artifacts\fuxa-pro-headless.exe'
        if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Expected pkg output was not found: $exe" }
        $file = Get-Item -LiteralPath $exe
        if ($file.Length -le 1MB) { throw "Built EXE is unexpectedly small: $($file.Length) bytes" }
        Write-Host "Verified EXE: $($file.FullName) ($($file.Length) bytes)"

    - name: List built files
      shell: bash
      run: ls -la artifacts/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: fuxa-pro-headless-1.3.4
        path: artifacts/fuxa-pro-headless.exe
        retention-days: 30

    - name: Start EXE health check
      shell: powershell
      run: |
        $stdout = Join-Path $PWD 'fuxa-exe.stdout.log'
        $stderr = Join-Path $PWD 'fuxa-exe.stderr.log'
        $process = Start-Process -FilePath "$PWD\artifacts\fuxa-pro-headless.exe" -ArgumentList @() -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        try {
          $ready = $false
          for ($i = 0; $i -lt 36; $i++) {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              Write-Host "FUXA EXE exited early with code $($process.ExitCode)."
              break
            }
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:1881/' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "FUXA EXE health check passed: HTTP $($response.StatusCode)"
                break
              }
            } catch {
              Write-Host "Waiting for FUXA EXE startup..."
            }
          }
          if (-not $ready) {
            Write-Host '===== FUXA EXE stdout ====='
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '===== FUXA EXE stderr ====='
            if (Test-Path $stderr) { Get-Content $stderr }
            throw 'FUXA EXE did not become ready on port 1881.'
          }
        } finally {
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Upload health-check logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: fuxa-pro-headless-health-logs-${{ github.run_id }}
        path: |
          fuxa-exe.stdout.log
          fuxa-exe.stderr.log
        if-no-files-found: warn
        retention-days: 14

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: headless-pro-latest
        name: FUXA PRO Headless (Latest)
        body: |
          ## FUXA PRO Headless EXE - 自动构建产物

          **构建时间**: ${{ github.run_started_at }}
          **Commit**: [${{ github.sha }}](${{ github.event.repository.html_url }}/commit/${{ github.sha }})
          **工作流**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 使用方法
          1. 下载 `fuxa-pro-headless.exe`
          2. 放到任意目录，双击运行
          3. 浏览器打开 http://127.0.0.1:1881/
          4. 数据自动保存在 exe 同目录的 `data\` 文件夹下

          ### 特性
          - 内置 Node.js 18 运行时，无需安装任何环境
          - Guardian 守护模式：崩溃后 2 秒自动重启
          - 便携式部署：整个目录可拷贝到其他电脑直接使用
          - 支持 S7/Modbus/MQTT/OPC UA 等全部设备驱动
        files: artifacts/fuxa-pro-headless.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

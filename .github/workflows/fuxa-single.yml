name: Build FUXA Single (Tecon)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  APP_VERSION: '1.3.2-tecon'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Cache server node_modules
      uses: actions/cache@v4
      with:
        path: server/node_modules
        key: ${{ runner.os }}-server-node-${{ hashFiles('server/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-server-node-

    - name: Cache client node_modules
      uses: actions/cache@v4
      with:
        path: client/node_modules
        key: ${{ runner.os }}-client-node-${{ hashFiles('client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-client-node-

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit --production
      working-directory: ./server

    - name: Install client dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./client

    - name: Build client
      run: npm run build -- --configuration=production
      working-directory: ./client

    - name: Setup Headless Package Directory
      run: |
        mkdir -p fuxa-single/server
        mkdir -p fuxa-single/client/dist
        
        cp -r server/. fuxa-single/server/
        cp -r client/dist/. fuxa-single/client/dist/
        cp app/headless/headless-entry.js fuxa-single/main.js
        
        rm -rf fuxa-single/server/node_modules/.cache
        rm -rf fuxa-single/server/node_modules/.bin
        find fuxa-single -name "*.map" -type f -delete
        find fuxa-single -name "*.ts" -type f -delete
        find fuxa-single -name "*.d.ts" -type f -delete
      shell: bash

    - name: Create Package Config
      run: |
        cat > fuxa-single/package.json <<EOF
        {
          "name": "fuxa-single",
          "version": "${{ env.APP_VERSION }}",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*",
              "node_modules/sqlite3/**/*",
              "node_modules/better-sqlite3/**/*"
            ],
            "scripts": [
              "server/**/*.js"
            ],
            "compression": "Brotli",
            "outputPath": "artifacts"
          }
        }
        EOF
      shell: bash

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg

    - name: Build Standalone Binary
      run: |
        pkg fuxa-single/package.json --targets node18-win-x64 --out-path artifacts --public-packages "node-snap7,bindings,nan" --compress Brotli
      shell: bash

    - name: Prepare artifacts
      run: |
        mv artifacts/fuxa-single-win-x64.exe artifacts/FUXA-single-${{ env.APP_VERSION }}-windows-x64.exe || true
      shell: bash

    - name: Get current date
      id: date
      run: echo "date=$(date +'%y%m%d-%H%M')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUXA-single-${{ steps.date.outputs.date }}
        path: artifacts/*
        retention-days: 1

    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.APP_VERSION }}-${{ steps.date.outputs.date }}
        name: FUXA Single ${{ env.APP_VERSION }}
        files: artifacts/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

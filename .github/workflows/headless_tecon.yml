name: Build FUXA PRO Headless EXE

on:
  workflow_dispatch:
  push:
    branches: [1.3.4-PRO]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'wiki/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install server dependencies
      run: |
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 5
        npm install --prefer-offline --no-audit
      working-directory: ./server

    - name: Setup Headless Package Directory
      shell: bash
      run: |
        mkdir -p fuxa-headless/server
        mkdir -p fuxa-headless/client/dist

        # Copy server and client/dist
        cp -r server/. fuxa-headless/server/
        cp -r client/dist/. fuxa-headless/client/dist/

        # 使用 Guardian 双模式入口（替代旧的 headless-entry.js）
        cp app/headless/headless-guardian.js fuxa-headless/main.js

    - name: Create Package Config
      shell: bash
      run: |
        cat > fuxa-headless/package.json <<'EOF'
        {
          "name": "fuxa-pro-headless",
          "version": "1.3.4-PRO",
          "bin": "main.js",
          "pkg": {
            "assets": [
              "server/**/*",
              "client/dist/**/*",
              "_reports/**/*"
            ],
            "compression": "GZip"
          }
        }
        EOF

    - name: Install yao-pkg
      run: npm install -g @yao-pkg/pkg

    - name: Build Standalone EXE (Node.js 18 + GZip)
      shell: bash
      run: |
        pkg fuxa-headless/package.json \
          --targets node18-win-x64 \
          --out-path artifacts \
          --public-packages "node-snap7,bindings,nan"

    - name: Rename artifact
      shell: bash
      run: mv artifacts/fuxa-pro-headless-win-x64.exe artifacts/fuxa-pro-headless.exe || true

    - name: List built files
      shell: bash
      run: ls -la artifacts/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: fuxa-pro-headless-1.3.4
        path: artifacts/fuxa-pro-headless.exe
        retention-days: 30

    - name: Start EXE health check
      shell: powershell
      run: |
        $process = Start-Process -FilePath "$PWD\artifacts\fuxa-pro-headless.exe" -ArgumentList '-p 1882' -PassThru
        try {
          $ready = $false
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:1882/' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "FUXA EXE health check passed: HTTP $($response.StatusCode)"
                break
              }
            } catch {
              Write-Host "Waiting for FUXA EXE startup..."
            }
          }
          if (-not $ready) {
            throw 'FUXA EXE did not become ready on port 1882.'
          }
        } finally {
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
        }

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: headless-pro-latest
        name: FUXA PRO Headless (Latest)
        body: |
          ## FUXA PRO Headless EXE - 自动构建产物

          **构建时间**: ${{ github.run_started_at }}
          **Commit**: [${{ github.sha }}](${{ github.event.repository.html_url }}/commit/${{ github.sha }})
          **工作流**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 使用方法
          1. 下载 `fuxa-pro-headless.exe`
          2. 放到任意目录，双击运行
          3. 浏览器打开 http://127.0.0.1:1881/
          4. 数据自动保存在 exe 同目录的 `data\` 文件夹下

          ### 特性
          - 内置 Node.js 18 运行时，无需安装任何环境
          - Guardian 守护模式：崩溃后 2 秒自动重启
          - 便携式部署：整个目录可拷贝到其他电脑直接使用
          - 支持 S7/Modbus/MQTT/OPC UA 等全部设备驱动
        files: artifacts/fuxa-pro-headless.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
